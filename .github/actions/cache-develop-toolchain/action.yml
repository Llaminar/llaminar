# @file action.yml
# @brief Restore and authenticate ISA-specific toolchains, reusing each runner's BuildKit cache.
name: Cache develop toolchains
description: Restore dependency-bound OCI toolchains before source compilation
inputs:
  cpu-isa:
    description: AVX512, AVX2, NEON, or both x86 ISAs
    required: true
outputs:
  neon-context:
    description: Digest-pinned BuildKit context for the admitted ARM64 toolchain
    value: ${{ steps.verify-neon.outputs.build_context }}
  neon-registry-cache:
    description: Trusted develop ARM64 layer-cache reference
    value: ${{ steps.cache.outputs.image }}-neon
runs:
  using: composite
  steps:
    - name: Prepare immutable toolchain cache keys and dependency context
      id: cache
      shell: bash
      env:
        CPU_ISA: ${{ inputs.cpu-isa }}
      run: |
        set -euo pipefail
        python3 scripts/ci/toolchain_cache.py prepare \
          --root "$RUNNER_TEMP/llaminar-toolchains" --cpu-isa "$CPU_ISA" \
          --github-output "$GITHUB_OUTPUT"
        printf 'image=ghcr.io/%s:build-cache-develop\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
    - name: Restore complete AVX512 toolchain
      id: restore-avx512
      if: inputs.cpu-isa == 'AVX512' || inputs.cpu-isa == 'both'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.cache.outputs.path_avx512 }}
        key: ${{ steps.cache.outputs.key_avx512 }}
    - name: Restore complete AVX2 toolchain
      id: restore-avx2
      if: inputs.cpu-isa == 'AVX2' || inputs.cpu-isa == 'both'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.cache.outputs.path_avx2 }}
        key: ${{ steps.cache.outputs.key_avx2 }}
    # Only a cold complete-image cache needs BuildKit's SDK layer cache. A
    # warm image is consumed directly, without solving the toolchain stages.
    - name: Checkpoint shared CUDA and ROCm SDKs for cold toolchains
      if: >-
        (inputs.cpu-isa == 'both' && steps.restore-avx512.outputs.cache-hit != 'true') ||
        ((inputs.cpu-isa == 'AVX2' || inputs.cpu-isa == 'both') && steps.restore-avx2.outputs.cache-hit != 'true')
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_RECORD_UPLOAD: "false"
        DOCKER_BUILD_SUMMARY: "false"
      with:
        context: ${{ steps.cache.outputs.context }}
        network: host
        target: gpu-sdk
        outputs: type=cacheonly
        provenance: false
        sbom: false
        cache-from: |
          type=gha,scope=llaminar-gpu-sdk,version=2
          type=registry,ref=${{ steps.cache.outputs.image }}-avx512
          type=registry,ref=${{ steps.cache.outputs.image }}-avx2
        # A cache outage can cost a future rebuild. This job still requires
        # a successful SDK build and a verified complete OCI toolchain.
        cache-to: type=gha,scope=llaminar-gpu-sdk,mode=max,version=2,ignore-error=true
    # This runner retains the named BuildKit worker. Its local layers and the
    # registry import cover cold OCI misses without a second remote SDK solve.
    - name: Build complete AVX512 toolchain on a cache miss
      if: (inputs.cpu-isa == 'AVX512' || inputs.cpu-isa == 'both') && steps.restore-avx512.outputs.cache-hit != 'true'
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_RECORD_UPLOAD: "false"
        DOCKER_BUILD_SUMMARY: "false"
      with:
        context: ${{ steps.cache.outputs.context }}
        network: host
        target: toolchain
        build-args: LLAMINAR_CPU_ISA=AVX512
        labels: |
          org.llaminar.toolchain_inputs=${{ steps.cache.outputs.fingerprint_avx512 }}
          org.llaminar.toolchain_isa=AVX512
        outputs: type=oci,dest=${{ steps.cache.outputs.path_avx512 }},tar=false
        provenance: false
        sbom: false
        cache-from: type=registry,ref=${{ steps.cache.outputs.image }}-avx512
    - name: Authenticate AVX512 toolchain bytes and inputs
      if: inputs.cpu-isa == 'AVX512' || inputs.cpu-isa == 'both'
      shell: bash
      env:
        CACHE_HIT: ${{ steps.restore-avx512.outputs.cache-hit }}
      run: |
        python3 scripts/ci/toolchain_cache.py verify \
          --root "$RUNNER_TEMP/llaminar-toolchains" --cpu-isa AVX512 \
          --cache-hit "${CACHE_HIT:-false}"
    # Save immediately: source compilation or a test failure cannot discard
    # an already authenticated complete dependency image.
    - name: Save complete AVX512 toolchain before compiling Llaminar
      if: (inputs.cpu-isa == 'AVX512' || inputs.cpu-isa == 'both') && steps.restore-avx512.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.cache.outputs.path_avx512 }}
        key: ${{ steps.cache.outputs.key_avx512 }}
    - name: Build complete AVX2 toolchain on a cache miss
      if: (inputs.cpu-isa == 'AVX2' || inputs.cpu-isa == 'both') && steps.restore-avx2.outputs.cache-hit != 'true'
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_RECORD_UPLOAD: "false"
        DOCKER_BUILD_SUMMARY: "false"
      with:
        context: ${{ steps.cache.outputs.context }}
        network: host
        target: toolchain
        build-args: LLAMINAR_CPU_ISA=AVX2
        labels: |
          org.llaminar.toolchain_inputs=${{ steps.cache.outputs.fingerprint_avx2 }}
          org.llaminar.toolchain_isa=AVX2
        outputs: type=oci,dest=${{ steps.cache.outputs.path_avx2 }},tar=false
        provenance: false
        sbom: false
        cache-from: |
          type=gha,scope=llaminar-gpu-sdk,version=2
          type=registry,ref=${{ steps.cache.outputs.image }}-avx2
    - name: Authenticate AVX2 toolchain bytes and inputs
      if: inputs.cpu-isa == 'AVX2' || inputs.cpu-isa == 'both'
      shell: bash
      env:
        CACHE_HIT: ${{ steps.restore-avx2.outputs.cache-hit }}
      run: |
        python3 scripts/ci/toolchain_cache.py verify \
          --root "$RUNNER_TEMP/llaminar-toolchains" --cpu-isa AVX2 \
          --cache-hit "${CACHE_HIT:-false}"
    # Save immediately: source compilation or a test failure cannot discard
    # an already authenticated complete dependency image.
    - name: Save complete AVX2 toolchain before compiling Llaminar
      if: (inputs.cpu-isa == 'AVX2' || inputs.cpu-isa == 'both') && steps.restore-avx2.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.cache.outputs.path_avx2 }}
        key: ${{ steps.cache.outputs.key_avx2 }}
    - name: Restore complete NEON toolchain
      id: restore-neon
      if: inputs.cpu-isa == 'NEON'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.cache.outputs.path_neon }}
        key: ${{ steps.cache.outputs.key_neon }}
    - name: Checkpoint the ARM64 CUDA SDK for cold toolchains
      if: inputs.cpu-isa == 'NEON' && steps.restore-neon.outputs.cache-hit != 'true'
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_RECORD_UPLOAD: "false"
        DOCKER_BUILD_SUMMARY: "false"
      with:
        context: ${{ steps.cache.outputs.context }}
        platforms: linux/arm64
        target: gpu-sdk
        build-args: |
          LLAMINAR_ENABLE_CUDA=ON
          LLAMINAR_ENABLE_ROCM=OFF
          LLAMINAR_CUDA_ARCHS=121
        outputs: type=cacheonly
        provenance: false
        sbom: false
        cache-from: |
          type=gha,scope=llaminar-gpu-sdk-neon,version=2
          type=registry,ref=${{ steps.cache.outputs.image }}-neon
        cache-to: type=gha,scope=llaminar-gpu-sdk-neon,mode=max,version=2,ignore-error=true
    - name: Build complete NEON toolchain on a cache miss
      if: inputs.cpu-isa == 'NEON' && steps.restore-neon.outputs.cache-hit != 'true'
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_RECORD_UPLOAD: "false"
        DOCKER_BUILD_SUMMARY: "false"
      with:
        context: ${{ steps.cache.outputs.context }}
        platforms: linux/arm64
        target: toolchain
        build-args: |
          LLAMINAR_CPU_ISA=NEON
          LLAMINAR_ENABLE_CUDA=ON
          LLAMINAR_ENABLE_ROCM=OFF
          LLAMINAR_CUDA_ARCHS=121
        labels: |
          org.llaminar.toolchain_inputs=${{ steps.cache.outputs.fingerprint_neon }}
          org.llaminar.toolchain_isa=NEON
        outputs: type=oci,dest=${{ steps.cache.outputs.path_neon }},tar=false
        provenance: false
        sbom: false
        # Consume the SDK checkpoint, as the AVX2 build does. Without it a warm
        # checkpoint leaves nothing local, so this step rebuilds the CUDA SDK
        # and its OCI export fails.
        cache-from: type=gha,scope=llaminar-gpu-sdk-neon,version=2
    - name: Authenticate NEON toolchain bytes and inputs
      id: verify-neon
      if: inputs.cpu-isa == 'NEON'
      shell: bash
      env:
        CACHE_HIT: ${{ steps.restore-neon.outputs.cache-hit }}
      run: |
        python3 scripts/ci/toolchain_cache.py verify \
          --root "$RUNNER_TEMP/llaminar-toolchains" --cpu-isa NEON \
          --cache-hit "${CACHE_HIT:-false}" --github-output "$GITHUB_OUTPUT"
    - name: Save complete NEON toolchain before compiling Llaminar
      if: inputs.cpu-isa == 'NEON' && steps.restore-neon.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.cache.outputs.path_neon }}
        key: ${{ steps.cache.outputs.key_neon }}
    - name: Bind the source image driver to the admitted toolchains
      shell: bash
      run: |
        printf 'LLAMINAR_DOCKER_TOOLCHAIN_ROOT=%s/llaminar-toolchains\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
