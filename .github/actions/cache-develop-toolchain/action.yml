name: Prepare authenticated develop toolchains
description: Build the complete OCI toolchain on the retained worker before source compilation
inputs:
  cpu-isa:
    description: AVX512, AVX2, or both for runtime publication
    required: true
runs:
  using: composite
  steps:
    - name: Build and authenticate the requested OCI toolchains
      shell: bash
      env:
        CPU_ISA: ${{ inputs.cpu-isa }}
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/llaminar-toolchains"
        python3 scripts/ci/toolchain_cache.py --root "$root" --cpu-isa "$CPU_ISA"
        printf 'LLAMINAR_DOCKER_TOOLCHAIN_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
