name: Arm develop PR auto-merge

# This trusted default-branch workflow only enables GitHub's native auto-merge.
# It never checks out or executes PR code. The develop ruleset, not this job,
# decides whether the required image-bound Unit/preflight check has passed.
on:
  pull_request_target:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  # The dedicated repository credential owns merge authority. The built-in
  # token stays read-only and must not suppress the develop push workflow.
  contents: read
  pull-requests: read

jobs:
  arm:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - name: Squash-merge automatically after the required check succeeds
        env:
          GH_TOKEN: ${{ secrets.DEVELOP_AUTOMERGE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?Repository secret DEVELOP_AUTOMERGE_TOKEN is required for auto-merge and post-merge CI}"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash \
            --match-head-commit "$PR_HEAD_SHA"
