name: Master release — promote PR-certified images

# Master accepts only a develop PR whose published-image E2E and benchmark
# checks passed. The merge is normally squashed, so the release validates the
# resulting tree against the tested develop image rather than equating SHAs.
on:
  push:
    branches: [master]

permissions:
  contents: write
  packages: write
  actions: read
  pull-requests: read

concurrency:
  group: llaminar-master-release
  cancel-in-progress: false

jobs:
  promote:
    name: Promote exact images and publish dated GitHub release
    runs-on: [llaminar-xeon-host]
    timeout-minutes: 90
    concurrency:
      group: llaminar-develop-image-gate
      cancel-in-progress: false
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retire legacy checkout evidence before Actions cleans the worktree
        shell: bash
        run: |
          set -euo pipefail
          legacy="$GITHUB_WORKSPACE/parity-results"
          if [[ -d "$legacy" ]]; then
            docker run --rm --user 0:0 --entrypoint /bin/rm \
              --mount "type=bind,src=$legacy,dst=/legacy" \
              "ghcr.io/${GITHUB_REPOSITORY,,}:develop-avx2" \
              -rf /legacy/published-e2e /legacy/published-benchmarks
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          submodules: false
          lfs: false
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          name: llaminar-ci
          driver-opts: network=host
          cleanup: false
          keep-state: true
          cache-binary: false
      - name: Install GitHub CLI on a minimal ARC runner
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends gh
          fi
          gh --version
      - name: Authenticate PR evidence and promote the exact runtime bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MASTER_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/publish_master_release.py \
            --repository "$REPOSITORY" --master-sha "$MASTER_SHA" \
            --output "$RUNNER_TEMP/llaminar-master-release-$GITHUB_RUN_ID"
      - name: Retain master release receipt and notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/llaminar-master-release-${{ github.run_id }}/master-release.json
            ${{ runner.temp }}/llaminar-master-release-${{ github.run_id }}/release-notes.md
          if-no-files-found: warn
          retention-days: 90

  high_water:
    name: Persist PR-certified high water on develop
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          lfs: false
      - name: Install GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends gh
          fi
      - name: Commit upward-only benchmark marks and numbers after merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MASTER_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/publish_pr_high_water.py \
            --repository "$REPOSITORY" --master-sha "$MASTER_SHA" \
            --output "$RUNNER_TEMP/llaminar-pr-high-water-$GITHUB_RUN_ID"
      - name: Retain high-water publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-high-water-${{ github.sha }}
          path: ${{ runner.temp }}/llaminar-pr-high-water-${{ github.run_id }}/high-water-publication.json
          if-no-files-found: warn
          retention-days: 90
