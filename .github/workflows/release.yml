name: Master release — promote PR-certified images

# Master accepts only a develop PR whose published-image E2E and benchmark
# checks passed. The merge is normally squashed, so the release validates the
# resulting tree against the tested develop image rather than equating SHAs.
on:
  # A squash message can contain GitHub's CI-skip marker in quoted prose.
  # The trusted post-merge event still fires in that case; publish only the
  # already-merged, same-repository develop PR's master commit.
  pull_request_target:
    types: [closed]
    branches: [master]
  # Recovery for a missed merge event. The publisher independently proves the
  # current master commit, its exact develop PR, both image IDs and artifacts.
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read
  pull-requests: read

concurrency:
  group: llaminar-master-release
  cancel-in-progress: false

jobs:
  promote:
    name: Promote exact images and publish dated GitHub release
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
        (github.event_name == 'pull_request_target' &&
         github.event.pull_request.merged == true &&
         github.event.pull_request.head.ref == 'develop' &&
         github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: [llaminar-xeon-host]
    timeout-minutes: 90
    concurrency:
      group: llaminar-develop-image-gate
      cancel-in-progress: false
      queue: max
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retire legacy checkout evidence before Actions cleans the worktree
        shell: bash
        run: |
          set -euo pipefail
          legacy="$GITHUB_WORKSPACE/parity-results"
          if [[ -d "$legacy" ]]; then
            docker run --rm --user 0:0 --entrypoint /bin/rm \
              --mount "type=bind,src=$legacy,dst=/legacy" \
              "ghcr.io/${GITHUB_REPOSITORY,,}:develop-avx2" \
              -rf /legacy/published-e2e /legacy/published-benchmarks
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true
          submodules: false
          lfs: false
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          name: llaminar-ci
          driver-opts: network=host
          cleanup: false
          keep-state: true
          cache-binary: false
      - name: Install GitHub CLI on a minimal ARC runner
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends gh
          fi
          gh --version
      - name: Authenticate PR evidence and promote the exact runtime bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MASTER_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.merge_commit_sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/publish_master_release.py \
            --repository "$REPOSITORY" --master-sha "$MASTER_SHA" \
            --output "$RUNNER_TEMP/llaminar-master-release-$GITHUB_RUN_ID"
      - name: Retain master release receipt and notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-release-${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.merge_commit_sha }}
          path: |
            ${{ runner.temp }}/llaminar-master-release-${{ github.run_id }}/master-release.json
            ${{ runner.temp }}/llaminar-master-release-${{ github.run_id }}/release-notes.md
          if-no-files-found: warn
          retention-days: 90

  documentation:
    name: Publish release documentation and certificates
    needs: promote
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml

  high_water:
    name: Persist PR-certified high water on develop
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          submodules: false
          lfs: false
      - name: Install GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends gh
          fi
      - name: Commit upward-only benchmark marks and numbers after merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEVELOP_DEPLOY_KEY }}
          MASTER_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.merge_commit_sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_DEPLOY_KEY" || {
            echo '::error::release evidence deploy key is not configured'
            exit 1
          }
          release_key_dir="$(mktemp -d "$RUNNER_TEMP/llaminar-release-key.XXXXXX")"
          cleanup_release_key() {
            if test -f "$release_key_dir/key"; then
              shred -u -- "$release_key_dir/key"
            fi
            if test -f "$release_key_dir/known_hosts"; then
              shred -u -- "$release_key_dir/known_hosts"
            fi
            rmdir -- "$release_key_dir"
          }
          trap cleanup_release_key EXIT
          printf '%s\n' "$RELEASE_DEPLOY_KEY" > "$release_key_dir/key"
          chmod 600 "$release_key_dir/key"
          gh api meta --jq '.ssh_keys[]' | awk '{print "github.com " $0}' \
            > "$release_key_dir/known_hosts"
          test -s "$release_key_dir/known_hosts" || {
            echo '::error::GitHub SSH host keys are unavailable'
            exit 1
          }
          export GIT_SSH_COMMAND="ssh -i $release_key_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$release_key_dir/known_hosts -o StrictHostKeyChecking=yes"
          python3 scripts/ci/publish_pr_high_water.py \
            --repository "$REPOSITORY" --master-sha "$MASTER_SHA" \
            --push-url "git@github.com:${REPOSITORY}.git" \
            --output "$RUNNER_TEMP/llaminar-pr-high-water-$GITHUB_RUN_ID"
      - name: Retain high-water publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-high-water-${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.merge_commit_sha }}
          path: ${{ runner.temp }}/llaminar-pr-high-water-${{ github.run_id }}/high-water-publication.json
          if-no-files-found: warn
          retention-days: 90
