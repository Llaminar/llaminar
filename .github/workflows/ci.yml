name: CI

# The develop branch publishes only freshly built, model-free-gated runtime
# images. Full generation, HTTP E2E, remote MPI, benchmarks and certification
# remain explicit production-pipeline work; this workflow must not grow a
# second copy of that heavier policy.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: llaminar-develop-image-gate
  cancel-in-progress: false

jobs:
  develop-images:
    # Manual dispatches from another branch must not mutate the develop tag.
    if: github.ref == 'refs/heads/develop'
    name: Build → Unit → Preflight → Publish develop images
    runs-on: [llaminar-xeon-host]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          lfs: false
      - uses: docker/setup-buildx-action@v4
        with:
          # The host-mounted OCI cache needs Buildx's local cache backend,
          # which the Docker driver cannot export.  This is one named BuildKit
          # worker *inside the host Docker daemon*, not a DIND graph store.
          # Retaining its state preserves Dockerfile ccache mounts when ARC
          # replaces the ephemeral GitHub runner pod.
          driver: docker-container
          name: llaminar-ci
          driver-opts: network=host
          cleanup: false
          keep-state: true
          # The runner's persistent host storage is the only build cache.
          # Do not send even Buildx's own helper binary through Actions cache.
          cache-binary: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, gate and publish both develop runtime images
        shell: bash
        run: |
          set -euo pipefail
          exec python3 scripts/ci/run_develop_image_gate.py \
            --output parity-results/develop-image-gate \
            --image "ghcr.io/${GITHUB_REPOSITORY,,}:develop" \
            --publish
      - name: Bound node-local BuildKit cache
        # A canceled build is still retiring its Buildx child. Pruning that
        # same worker during cancellation can wait on its active build lock.
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/ci/prune_docker_build_cache.sh
      - name: Retain develop-image build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # This is compact diagnostic evidence, never a Docker or compiler
          # cache. The host-owned BuildKit/ccache stores remain local.
          name: develop-image-gate-${{ github.run_id }}
          # The per-ISA source snapshot is a Buildx input, not evidence. Its
          # identity is sealed in develop-image-gate.json and it can contain
          # hundreds of MiB of tracked diagnostic CSVs which Docker itself
          # excludes. Upload logs, receipts and CTest/JUnit proof only.
          path: |
            parity-results/develop-image-gate/develop-image-gate.json
            parity-results/develop-image-gate/**/build-*.log
            parity-results/develop-image-gate/**/build-timeline.jsonl
            parity-results/develop-image-gate/**/prerequisites.log
            parity-results/develop-image-gate/**/prerequisites.process.log
            parity-results/develop-image-gate/**/prerequisites/**
          if-no-files-found: error
          retention-days: 30
