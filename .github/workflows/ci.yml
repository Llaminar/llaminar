name: CI

# Develop publishes Release runtime images on a GitHub-hosted larger runner.
# Unit and host-preflight tests belong to the separate PR gate. This push job
# only builds and publishes; complete certification remains production work.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Only the newest develop head needs publication. Cancel superseded builds.
concurrency:
  group: llaminar-cloud-develop-images
  cancel-in-progress: true

jobs:
  develop-images:
    # Manual dispatches from another branch must not mutate the develop tag.
    if: github.ref == 'refs/heads/develop'
    name: Build → Publish develop images
    runs-on:
      group: Develop CI
      labels: llaminar-cloud-16
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          lfs: false
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
        with:
          version: v0.38.1
          # Complete OCI toolchains survive the ephemeral VM; registry layer
          # caches accelerate the remaining build. Ccache is shared per job.
          driver: docker-container
          driver-opts: |
            network=host
            image=moby/buildkit@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
          cache-binary: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/cache-develop-toolchain
        with:
          cpu-isa: both
      - name: Build and publish both develop runtime images
        shell: bash
        run: |
          set -euo pipefail
          export LLAMINAR_DOCKER_BUILD_CACHE_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:build-cache-develop"
          exec python3 scripts/ci/run_develop_image_gate.py \
            --build-only \
            --output parity-results/develop-image-gate \
            --image "ghcr.io/${GITHUB_REPOSITORY,,}:develop" \
            --publish
      - name: Retain develop-image build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Compact build evidence; compiler/layer caches are not artifacts.
          name: develop-image-gate-${{ github.run_id }}
          # The per-ISA source snapshot is a Buildx input, not evidence. Its
          # identity is sealed in develop-image-gate.json and it can contain
          # hundreds of MiB of tracked diagnostic CSVs which Docker itself
          # excludes. Upload build/publication logs and identity receipts only.
          path: |
            ${{ runner.temp }}/llaminar-toolchains/*-toolchain.json
            parity-results/develop-image-gate/develop-image-gate.json
            parity-results/develop-image-gate/**/build-*.log
            parity-results/develop-image-gate/**/build-timeline.jsonl
            parity-results/develop-image-gate/**/publish.log
          if-no-files-found: error
          retention-days: 30
