name: CI

# Develop publishes Release runtime images on a GitHub-hosted larger runner.
# Device-free Unit tests belong to the separate PR gate. This push job only
# builds and publishes; preflight and certification remain production work.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: llaminar-cloud-develop-images
  cancel-in-progress: false
  queue: max

jobs:
  develop-images:
    # Manual dispatches from another branch must not mutate the develop tag.
    if: github.ref == 'refs/heads/develop'
    name: Build → Publish develop images
    runs-on:
      group: Cloud image builds
      labels: llaminar-cloud-64
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          lfs: false
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
        with:
          # The cloud VM is ephemeral. Registry layer caches retain compiler
          # and SDK layers; the job's worker shares ccache across both ISAs.
          driver: docker-container
          driver-opts: network=host
          cache-binary: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish both develop runtime images
        shell: bash
        run: |
          set -euo pipefail
          export LLAMINAR_DOCKER_BUILD_CACHE_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:build-cache-develop"
          exec python3 scripts/ci/run_develop_image_gate.py \
            --build-only \
            --output parity-results/develop-image-gate \
            --image "ghcr.io/${GITHUB_REPOSITORY,,}:develop" \
            --publish
      - name: Retain develop-image build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Compact build evidence; compiler/layer caches are not artifacts.
          name: develop-image-gate-${{ github.run_id }}
          # The per-ISA source snapshot is a Buildx input, not evidence. Its
          # identity is sealed in develop-image-gate.json and it can contain
          # hundreds of MiB of tracked diagnostic CSVs which Docker itself
          # excludes. Upload build/publication logs and identity receipts only.
          path: |
            parity-results/develop-image-gate/develop-image-gate.json
            parity-results/develop-image-gate/**/build-*.log
            parity-results/develop-image-gate/**/build-timeline.jsonl
            parity-results/develop-image-gate/**/publish.log
          if-no-files-found: error
          retention-days: 30
