name: Develop Unit and host gate

# Runner-group access is pinned to this workflow on develop. The caller keeps
# the pull_request event, so checkout still tests its proposed merge commit.
# The dedicated development host builds AVX2 and runs complete Unit plus host
# preflight. CPU admission rejects unsupported hardware before compilation.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    # Only same-repository PRs into develop may use the dedicated host.
    if: >-
      github.event_name == 'pull_request' && github.base_ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cpu_isa: [AVX2]
    name: Unit + host (${{ matrix.cpu_isa }})
    runs-on:
      group: Develop CI
      labels: llaminar-develop-avx2
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          lfs: false
          persist-credentials: false
      - name: Admit the requested CPU ISA before toolchain preparation
        shell: bash
        env:
          CPU_ISA: ${{ matrix.cpu_isa }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, "scripts/ci")
          from run_develop_image_gate import require_host_cpu_isa
          require_host_cpu_isa(os.environ["CPU_ISA"])
          PY
      - uses: docker/setup-buildx-action@v4
        with:
          version: v0.38.1
          name: llaminar-develop
          driver: docker-container
          # Reuse the named worker's layers and ccache mounts across jobs,
          # including source builds that fail before exporting an image.
          keep-state: true
          driver-opts: |
            network=host
            image=moby/buildkit@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
          cache-binary: false
      - uses: ./.github/actions/cache-develop-toolchain
        with:
          cpu-isa: ${{ matrix.cpu_isa }}
      - name: Build ${{ matrix.cpu_isa }} test inventory and run Unit plus host tests
        shell: bash
        env:
          CPU_ISA: ${{ matrix.cpu_isa }}
          LLAMINAR_DOCKER_BUILD_CACHE_ACCESS: import-only
        run: |
          set -euo pipefail
          export LLAMINAR_DOCKER_BUILD_CACHE_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:build-cache-develop"
          exec python3 scripts/ci/run_develop_image_gate.py \
            --cpu-isa "$CPU_ISA" \
            --output "$RUNNER_TEMP/llaminar-develop-pr-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Retain image-bound Unit and host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: develop-pr-${{ github.event.pull_request.number }}-${{ matrix.cpu_isa }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Logs/receipts only: no source snapshots, images or compiler cache.
          path: |
            ${{ runner.temp }}/llaminar-toolchains/*-toolchain.json
            ${{ runner.temp }}/llaminar-develop-pr-${{ github.run_id }}-${{ github.run_attempt }}/develop-image-gate.json
            ${{ runner.temp }}/llaminar-develop-pr-${{ github.run_id }}-${{ github.run_attempt }}/*/build-*.log
            ${{ runner.temp }}/llaminar-develop-pr-${{ github.run_id }}-${{ github.run_attempt }}/*/build-timeline.jsonl
            ${{ runner.temp }}/llaminar-develop-pr-${{ github.run_id }}-${{ github.run_attempt }}/*/pr-tests.log
            ${{ runner.temp }}/llaminar-develop-pr-${{ github.run_id }}-${{ github.run_attempt }}/*/pr-tests.process.log
            ${{ runner.temp }}/llaminar-develop-pr-${{ github.run_id }}-${{ github.run_attempt }}/*/pr-tests/**
          if-no-files-found: warn
          retention-days: 30
