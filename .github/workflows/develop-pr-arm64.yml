# @file develop-pr-arm64.yml
# @brief Build native Linux ARM64 Llaminar and run its model-free PR test scope.
name: Develop PR — ARM64

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: develop-pr-arm64-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  arm64:
    name: ARM64 build and Unit + host
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          lfs: false
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build the ARM64 test-runner and runtime siblings
        shell: bash
        run: |
          test "$(uname -m)" = aarch64
          evidence="$RUNNER_TEMP/llaminar-arm64-evidence"
          mkdir -p "$evidence"
          args=(
            --platform linux/arm64 --progress plain --load
            --build-arg "VCS_REF=$(git rev-parse HEAD)"
            --build-arg "LLAMINAR_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
            --build-arg LLAMINAR_CPU_ISA=NEON
            --build-arg LLAMINAR_ENABLE_CUDA=ON --build-arg LLAMINAR_ENABLE_ROCM=OFF
            --build-arg LLAMINAR_CUDA_ARCHS=121
            --build-arg LLAMINAR_SKIP_INTEGRATION=0
            --build-arg LLAMINAR_BUILD_MODEL_PARITY_MATRICES=OFF
            --build-arg LLAMINAR_TEST_RUNNER_INVENTORY=arm64-pr
            --build-arg "LLAMINAR_TEST_UID=$(id -u)"
            --build-arg "LLAMINAR_TEST_GID=$(id -g)"
          )
          for target in test-runner runtime; do
            docker buildx build "${args[@]}" --target "$target" \
              --tag "llaminar-arm64-$target:pr" . 2>&1 | tee "$evidence/build-$target.log"
          done
      - name: Smoke-test the ARM64 CUDA runtime
        shell: bash
        run: |
          docker run --rm --entrypoint /usr/local/bin/llaminar2 \
            llaminar-arm64-runtime:pr --help
      - name: Run ARM64 Unit and host preflight
        shell: bash
        run: |
          image="$(docker image inspect --format '{{.Id}}' llaminar-arm64-test-runner:pr)"
          docker run --rm --user "$(id -u):$(id -g)" --ulimit core=0:0 \
            --network host --ipc private --shm-size=1g \
            --cap-add=SYS_NICE --cap-add=SYS_PTRACE --security-opt seccomp=unconfined \
            --env LLAMINAR_FORCE_CPU_ONLY_STARTUP=1 \
            --mount "type=bind,source=$RUNNER_TEMP/llaminar-arm64-evidence,target=/evidence" \
            "$image" python3 scripts/ci/run_develop_pr_tests.py --arm64 \
              --build-dir build_v2_integration --installed-build-receipt /src/installed-tests.json \
              --output /evidence/tests
      - name: Retain ARM64 build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: develop-pr-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/llaminar-arm64-evidence/
          retention-days: 30
