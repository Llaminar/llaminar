# @file develop-pr-arm64.yml
# @brief Build native Linux ARM64 Llaminar and run its model-free PR test scope.
name: Develop PR — ARM64

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: develop-pr-arm64-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  arm64:
    name: ARM64 build and Unit + host
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          lfs: false
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
        with:
          version: v0.38.1
          driver: docker-container
          driver-opts: |
            image=moby/buildkit@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
          cache-binary: false
      - uses: ./.github/actions/cache-develop-toolchain
        id: toolchain
        with:
          cpu-isa: NEON
      - name: Prepare the native image build
        id: build
        shell: bash
        env:
          TOOLCHAIN_CONTEXT: ${{ steps.toolchain.outputs.neon-context }}
        run: |
          test "$(uname -m)" = aarch64
          : "${TOOLCHAIN_CONTEXT:?missing admitted NEON toolchain}"
          mkdir -p "$RUNNER_TEMP/llaminar-arm64-evidence"
          source_tree=$(git rev-parse HEAD^{tree})
          toolchain_digest=${TOOLCHAIN_CONTEXT##*@sha256:}
          [[ "$toolchain_digest" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "ccache-prefix=llaminar-ccache-v1-neon-$toolchain_digest-"
            echo "source-tree=$source_tree"
            echo 'args<<BUILD_ARGS'
            echo "LLAMINAR_TOOLCHAIN_CONTEXT=$TOOLCHAIN_CONTEXT"
            echo "VCS_REF=$(git rev-parse HEAD)"
            echo "LLAMINAR_SOURCE_TREE=$source_tree"
            echo 'LLAMINAR_CPU_ISA=NEON'
            echo 'LLAMINAR_ENABLE_CUDA=ON'
            echo 'LLAMINAR_ENABLE_ROCM=OFF'
            echo 'LLAMINAR_CUDA_ARCHS=121'
            echo 'LLAMINAR_SKIP_INTEGRATION=0'
            echo 'LLAMINAR_BUILD_MODEL_PARITY_MATRICES=OFF'
            echo 'LLAMINAR_TEST_RUNNER_INVENTORY=arm64-pr'
            echo "LLAMINAR_TEST_UID=$(id -u)"
            echo "LLAMINAR_TEST_GID=$(id -g)"
            echo BUILD_ARGS
          } >> "$GITHUB_OUTPUT"
      - name: Restore ARM64 compiler objects
        id: ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/llaminar-neon-ccache
          key: ${{ steps.build.outputs.ccache-prefix }}${{ steps.build.outputs.source-tree }}
          restore-keys: ${{ steps.build.outputs.ccache-prefix }}
      - name: Seed the BuildKit compiler cache mount
        if: steps.ccache.outputs.cache-matched-key != ''
        continue-on-error: true
        shell: bash
        run: bash scripts/ci/transfer_arm64_ccache.sh restore
      - name: Export original canonical Integration attempt evidence
        id: integration-evidence
        shell: bash
        env:
          BUILD_ARGS: ${{ steps.build.outputs.args }}
          TOOLCHAIN_CONTEXT: ${{ steps.toolchain.outputs.neon-context }}
        run: |
          args=()
          while IFS= read -r arg; do args+=(--build-arg "$arg"); done <<< "$BUILD_ARGS"
          docker buildx build "${args[@]}" --build-context "$TOOLCHAIN_CONTEXT" \
            --platform linux/arm64 --progress rawjson --target arm64-build-evidence \
            --output "type=local,dest=$RUNNER_TEMP/llaminar-arm64-evidence/canonical-integration" . \
            2> "$RUNNER_TEMP/llaminar-arm64-evidence/canonical-export.rawjson"
          nonce=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["nonce"])' "$RUNNER_TEMP/llaminar-arm64-evidence/canonical-integration/status.json")
          echo "nonce=$nonce" >> "$GITHUB_OUTPUT"
      - name: Build the sealed ARM64 test-runner
        shell: bash
        env:
          BUILD_ARGS: ${{ steps.build.outputs.args }}
          TOOLCHAIN_CONTEXT: ${{ steps.toolchain.outputs.neon-context }}
          EXPECTED_NONCE: ${{ steps.integration-evidence.outputs.nonce }}
        run: |
          args=()
          while IFS= read -r arg; do args+=(--build-arg "$arg"); done <<< "$BUILD_ARGS"
          docker buildx build "${args[@]}" --build-arg "LLAMINAR_EXPECTED_BUILD_NONCE=$EXPECTED_NONCE" \
            --build-context "$TOOLCHAIN_CONTEXT" --platform linux/arm64 --progress rawjson \
            --load --target test-runner --tag llaminar-arm64-test-runner:pr \
            --cache-from type=gha,scope=llaminar-build-neon-pr,version=2 \
            --cache-from type=registry,ref=${{ steps.toolchain.outputs.neon-registry-cache }} \
            --cache-to type=gha,scope=llaminar-build-neon-pr,mode=max,version=2,ignore-error=true . \
            2> "$RUNNER_TEMP/llaminar-arm64-evidence/canonical-main.rawjson"
      - name: Export the sibling Release runtime from the same builder
        shell: bash
        env:
          BUILD_ARGS: ${{ steps.build.outputs.args }}
          TOOLCHAIN_CONTEXT: ${{ steps.toolchain.outputs.neon-context }}
        run: |
          args=()
          while IFS= read -r arg; do
            args+=(--build-arg "$arg")
          done <<< "$BUILD_ARGS"
          docker buildx build "${args[@]}" --build-context "${TOOLCHAIN_CONTEXT:?}" \
            --platform linux/arm64 --progress plain --load --target runtime \
            --tag llaminar-arm64-runtime:pr . 2>&1 \
            | tee "$RUNNER_TEMP/llaminar-arm64-evidence/build-runtime.log"
      - name: Smoke-test the ARM64 CUDA runtime
        shell: bash
        run: |
          docker run --rm --entrypoint /usr/local/bin/llaminar2 \
            llaminar-arm64-runtime:pr --help
      - name: Run ARM64 Unit and host preflight
        shell: bash
        run: |
          image="$(docker image inspect --format '{{.Id}}' llaminar-arm64-test-runner:pr)"
          docker run --rm --user "$(id -u):$(id -g)" --ulimit core=0:0 \
            --network host --ipc private --shm-size=1g \
            --cap-add=SYS_NICE --cap-add=SYS_PTRACE --security-opt seccomp=unconfined \
            --env LLAMINAR_FORCE_CPU_ONLY_STARTUP=1 \
            --mount "type=bind,source=$RUNNER_TEMP/llaminar-arm64-evidence,target=/evidence" \
            "$image" python3 scripts/ci/run_develop_pr_tests.py --arm64 \
              --build-dir build_v2_integration --installed-build-receipt /src/installed-tests.json \
              --output /evidence/tests
      - name: Export the BuildKit compiler cache mount
        id: export-ccache
        if: steps.ccache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        run: bash scripts/ci/transfer_arm64_ccache.sh save
      - name: Save ARM64 compiler objects
        if: steps.export-ccache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/llaminar-neon-ccache
          key: ${{ steps.build.outputs.ccache-prefix }}${{ steps.build.outputs.source-tree }}
      - name: Compile and verify required ARM optional ISA envelopes
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        env:
          TOOLCHAIN_CONTEXT: ${{ steps.toolchain.outputs.neon-context }}
        run: |
          mkdir -p "$RUNNER_TEMP/llaminar-arm64-evidence/envelopes"
          cat > "$RUNNER_TEMP/arm-envelope.Dockerfile" <<'EOF'
          FROM toolchain
          COPY . /envelope-source
          WORKDIR /envelope-source
          ENTRYPOINT ["python3", "scripts/ci/arm_envelope_checks.py", "/envelope-source", "/evidence"]
          EOF
          context=$(mktemp -d)
          git archive HEAD | tar -x -C "$context"
          git rev-parse HEAD HEAD^{tree} > "$context/arm-envelope-source.txt"
          python3 - "$context" <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          manifest = dict(commit=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), tree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), files={str(p.relative_to(root)): ({'symlink': os.readlink(p)} if p.is_symlink() else {'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}) for p in root.rglob('*') if p.is_file() or p.is_symlink()})
          (root / 'arm-envelope-manifest.json').write_text(json.dumps(manifest, sort_keys=True))
          PYTHON
          manifest_sha=$(sha256sum "$context/arm-envelope-manifest.json" | cut -d' ' -f1)
          cp "$context/arm-envelope-manifest.json" "$RUNNER_TEMP/llaminar-arm64-evidence/envelopes/"
          cp "$RUNNER_TEMP/arm-envelope.Dockerfile" "$context/arm-envelope.Dockerfile"
          docker buildx build --platform linux/arm64 --load \
            --build-context "$TOOLCHAIN_CONTEXT" -f "$RUNNER_TEMP/arm-envelope.Dockerfile" \
            -t llaminar-arm-envelopes:pr "$context" 2>&1 | tee "$RUNNER_TEMP/llaminar-arm64-evidence/envelopes-image.log"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/llaminar-arm64-evidence/envelopes/source.txt"
          printf '%s\n' "$TOOLCHAIN_CONTEXT" > "$RUNNER_TEMP/llaminar-arm64-evidence/envelopes/toolchain.txt"
          docker run --rm --env "ARM_ENVELOPE_MANIFEST_SHA256=$manifest_sha" --mount "type=bind,source=$RUNNER_TEMP/llaminar-arm64-evidence/envelopes,target=/evidence" llaminar-arm-envelopes:pr
      - name: Retain ARM64 build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: develop-pr-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/llaminar-arm64-evidence/
            ${{ runner.temp }}/llaminar-toolchains/neon-toolchain.json
          retention-days: 30
