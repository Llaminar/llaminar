name: Develop PR — device-free Unit tests
run-name: "develop PR #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.head.sha }}"

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Different PRs run concurrently; new commits replace only their own PR run.
concurrency:
  group: llaminar-cloud-develop-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit:
    # Preserve the existing same-repository PR admission policy.
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Develop PR
    # A pinned reusable workflow lets PR merge refs use the restricted group.
    uses: Llaminar/llaminar/.github/workflows/develop-unit.yml@develop
