name: Develop PR — device-free Unit tests
run-name: "develop PR #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.head.sha }}"

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# PRs and publication share one 16-core cloud slot, separate from production.
concurrency:
  group: llaminar-cloud-develop-ci
  cancel-in-progress: false
  queue: max

jobs:
  unit:
    # Preserve the existing same-repository PR admission policy.
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Develop PR
    # A pinned reusable workflow lets PR merge refs use the restricted group.
    uses: Llaminar/llaminar/.github/workflows/develop-unit.yml@develop
