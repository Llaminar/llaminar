name: Develop PR — Unit and host tests
run-name: "develop PR #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.head.sha }}"

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  unit:
    # Drafts allocate no runner; ready_for_review starts the normal gate.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    name: Develop PR
    # A pinned reusable workflow lets PR merge refs use the restricted group.
    uses: Llaminar/llaminar/.github/workflows/develop-pr-tests.yml@develop
