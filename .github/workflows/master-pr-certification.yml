name: Master PR — published-image certification
run-name: "master PR #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.head.sha }}"

# Required PR checks are emitted by this pull_request workflow itself. A
# workflow_dispatch/workflow_run check is not attached to the PR merge ref and
# cannot satisfy master protection. The manual E2E/benchmark workflows remain
# useful for diagnostics; both routes call the same canonical suite driver.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  packages: read
  actions: read
  pull-requests: read

jobs:
  source:
    name: Admit exact develop image source
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: false
          lfs: false
      - name: Require this repository's develop head
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEAD_REPO" == "$REPOSITORY" && "$HEAD_BRANCH" == develop ]] || {
            echo '::error::master certification requires a same-repository develop PR'
            exit 1
          }
          python3 scripts/ci/wait_for_develop_image_gate.py \
            --repository "$REPOSITORY" --revision "$HEAD_SHA"

  e2e:
    name: Published E2E (AVX512 and AVX2)
    needs: source
    runs-on: [llaminar-xeon-host]
    timeout-minutes: 720
    concurrency:
      group: llaminar-develop-image-gate
      cancel-in-progress: false
      queue: max
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retire legacy checkout evidence before Actions cleans the worktree
        shell: bash
        run: |
          set -euo pipefail
          legacy="$GITHUB_WORKSPACE/parity-results"
          if [[ -d "$legacy" ]]; then
            docker run --rm --user 0:0 --entrypoint /bin/rm \
              --mount "type=bind,src=$legacy,dst=/legacy" \
              "ghcr.io/${GITHUB_REPOSITORY,,}:develop-avx2" \
              -rf /legacy/published-e2e /legacy/published-benchmarks
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: false
          lfs: false
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          name: llaminar-ci
          driver-opts: network=host
          cleanup: false
          keep-state: true
          cache-binary: false
      - name: Run exact-ref HTTP E2E on both published ISA images
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          exec python3 scripts/ci/run_published_image_suite.py e2e \
            --repository "$REPOSITORY" --branch develop \
            --image "ghcr.io/${REPOSITORY,,}:develop-$HEAD_SHA" \
            --expected-source-revision "$HEAD_SHA" \
            --output "$RUNNER_TEMP/llaminar-pr-e2e-$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Retain compact authenticated E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-e2e-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/llaminar-pr-e2e-${{ github.run_id }}/images.json
            ${{ runner.temp }}/llaminar-pr-e2e-${{ github.run_id }}/all-cells.json
            ${{ runner.temp }}/llaminar-pr-e2e-${{ github.run_id }}/manifest.json
            ${{ runner.temp }}/llaminar-pr-e2e-${{ github.run_id }}/e2e-receipt.json
            ${{ runner.temp }}/llaminar-pr-e2e-${{ github.run_id }}/avx512/e2e.json
            ${{ runner.temp }}/llaminar-pr-e2e-${{ github.run_id }}/avx2/e2e.json
          if-no-files-found: warn
          retention-days: 90

  coding_matrix:
    name: Admit post-benchmark coding matrix
    needs: benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: false
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          name: pr-e2e-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/coding-e2e
      - uses: actions/download-artifact@v4
        with:
          name: pr-benchmarks-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/coding-benchmarks
      - name: Derive every blessed cell on both shipping ISAs
        id: matrix
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/ci/run_opencode_matrix.py prepare \
            --e2e-bundle "$RUNNER_TEMP/coding-e2e" \
            --benchmark-bundle "$RUNNER_TEMP/coding-benchmarks" \
            --expected-source-revision "$HEAD_SHA" \
            --output "$RUNNER_TEMP/coding-matrix.json" --github-output "$GITHUB_OUTPUT"

  coding_cells:
    name: OpenCode ${{ matrix.cpu_isa }} — ${{ matrix.case }}
    needs: coding_matrix
    runs-on: [llaminar-xeon-host]
    # This is the platform's self-hosted job ceiling, not a generation or
    # session watchdog. The client and server impose no reasoning deadline.
    timeout-minutes: 7200
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.coding_matrix.outputs.matrix) }}
    concurrency:
      group: llaminar-develop-image-gate
      cancel-in-progress: false
      queue: max
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: false
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          name: pr-e2e-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/coding-e2e
      - uses: actions/download-artifact@v4
        with:
          name: pr-benchmarks-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/coding-benchmarks
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          name: llaminar-ci
          driver-opts: network=host
          cleanup: false
          keep-state: true
          cache-binary: false
      - name: Run one complete app session on the benchmarked image
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          CODING_CASE: ${{ matrix.case }}
          CODING_ISA: ${{ matrix.cpu_isa }}
          CODING_ARTIFACT: ${{ matrix.artifact_id }}
        run: |
          exec python3 scripts/ci/run_published_image_suite.py opencode \
            --repository "$REPOSITORY" --branch develop \
            --image "ghcr.io/${REPOSITORY,,}:develop-$HEAD_SHA" \
            --expected-source-revision "$HEAD_SHA" \
            --e2e-bundle "$RUNNER_TEMP/coding-e2e" \
            --benchmark-bundle "$RUNNER_TEMP/coding-benchmarks" \
            --cpu-isa "$CODING_ISA" --cell "$CODING_CASE" \
            --output "$RUNNER_TEMP/coding-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$CODING_ARTIFACT"
      - name: Retain independently replayable coding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-coding-cell-${{ matrix.artifact_id }}
          path: ${{ runner.temp }}/coding-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.artifact_id }}/cell-result.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  coding:
    name: Published OpenCode (AVX512 and AVX2)
    needs: [coding_matrix, coding_cells]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: false
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          name: pr-e2e-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/coding-e2e
      - uses: actions/download-artifact@v4
        with:
          name: pr-benchmarks-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/coding-benchmarks
      - uses: actions/download-artifact@v4
        with:
          pattern: pr-coding-cell-*
          path: ${{ runner.temp }}/coding-jobs
      - name: Revalidate complete canonical coverage and every independent audit
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MATRIX_RESULT: ${{ needs.coding_cells.result }}
        run: |
          python3 scripts/ci/run_opencode_matrix.py aggregate \
            --e2e-bundle "$RUNNER_TEMP/coding-e2e" \
            --benchmark-bundle "$RUNNER_TEMP/coding-benchmarks" \
            --expected-source-revision "$HEAD_SHA" --jobs "$RUNNER_TEMP/coding-jobs" \
            --jobs-result "$MATRIX_RESULT" \
            --output "$RUNNER_TEMP/coding-proof/opencode.json"
      - name: Retain complete coding matrix proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-opencode-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/coding-proof/opencode.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  benchmarks:
    name: Published benchmarks (AVX512 and AVX2)
    needs: e2e
    runs-on: [llaminar-xeon-host]
    timeout-minutes: 720
    permissions:
      contents: read
      packages: read
      actions: read
      pull-requests: write
    concurrency:
      group: llaminar-develop-image-gate
      cancel-in-progress: false
      queue: max
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retire legacy checkout evidence before Actions cleans the worktree
        shell: bash
        run: |
          set -euo pipefail
          legacy="$GITHUB_WORKSPACE/parity-results"
          if [[ -d "$legacy" ]]; then
            docker run --rm --user 0:0 --entrypoint /bin/rm \
              --mount "type=bind,src=$legacy,dst=/legacy" \
              "ghcr.io/${GITHUB_REPOSITORY,,}:develop-avx2" \
              -rf /legacy/published-e2e /legacy/published-benchmarks
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: false
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          name: pr-e2e-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/llaminar-pr-e2e-evidence
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          name: llaminar-ci
          driver-opts: network=host
          cleanup: false
          keep-state: true
          cache-binary: false
      - name: Benchmark only the exact pair proven by E2E
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          exec python3 scripts/ci/run_published_image_suite.py benchmarks \
            --repository "$REPOSITORY" --branch develop \
            --image "ghcr.io/${REPOSITORY,,}:develop-$HEAD_SHA" \
            --expected-source-revision "$HEAD_SHA" \
            --e2e-bundle "$RUNNER_TEMP/llaminar-pr-e2e-evidence" \
            --output "$RUNNER_TEMP/llaminar-pr-benchmarks-$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Install GitHub CLI for PR measurement summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends gh
          fi
      - name: Report all benchmark numbers and RAG on the PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/post_pr_benchmark_rag.py \
            --repository "$REPOSITORY" --pr "$PR_NUMBER" \
            --source-revision "$HEAD_SHA" \
            --report "$RUNNER_TEMP/llaminar-pr-benchmarks-$GITHUB_RUN_ID/results.json" \
            --run-url "$GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Retain complete compact benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-benchmarks-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/llaminar-pr-benchmarks-${{ github.run_id }}/images.json
            ${{ runner.temp }}/llaminar-pr-benchmarks-${{ github.run_id }}/manifest.json
            ${{ runner.temp }}/llaminar-pr-benchmarks-${{ github.run_id }}/results.json
            ${{ runner.temp }}/llaminar-pr-benchmarks-${{ github.run_id }}/benchmarks.svg
            ${{ runner.temp }}/llaminar-pr-benchmarks-${{ github.run_id }}/avx512/benchmarks.json
            ${{ runner.temp }}/llaminar-pr-benchmarks-${{ github.run_id }}/avx2/benchmarks.json
          if-no-files-found: warn
          retention-days: 90
