name: Release branch policy

on:
  pull_request:
    branches: [master, 'rc/**']
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: llaminar-develop-image-gate
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce-source-branch:
    if: ${{ !github.event.pull_request.draft }}
    name: Release branch lineage
    runs-on: [llaminar-xeon-host]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Require develop → rc/* → master
        run: python3 scripts/ci/release_candidate.py
