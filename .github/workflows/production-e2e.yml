name: Published images — HTTP E2E

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# All image consumers share the same physical accelerator inventory with CI.
concurrency:
  group: llaminar-develop-image-gate
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: [llaminar-xeon-host]
    # Both ISA suites must finish even if every independent 15-minute cell is
    # red: the current 26-cell projection, including its two AVX2 CPU
    # allowances, can consume 400 minutes before shared setup and publication.
    timeout-minutes: 480
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retire legacy checkout evidence with its cache-owner identity
        shell: bash
        run: |
          set -euo pipefail
          legacy="$GITHUB_WORKSPACE/parity-results"
          if [[ -d "$legacy" ]]; then
            docker run --rm --user 0:0 --entrypoint /bin/rm \
              --mount "type=bind,src=$legacy,dst=/legacy" \
              "ghcr.io/${GITHUB_REPOSITORY,,}:develop-avx2" \
              -rf /legacy/published-e2e /legacy/published-benchmarks
          fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
          lfs: false
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          name: llaminar-ci
          driver-opts: network=host
          cleanup: false
          keep-state: true
          cache-binary: false
      - name: Test both published runtime images with the full canonical HTTP suite
        run: |
          python3 scripts/ci/run_published_image_suite.py e2e \
            --output "$RUNNER_TEMP/llaminar-published-e2e-$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Retain image-bound E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-e2e-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/llaminar-published-e2e-${{ github.run_id }}/images.json
            ${{ runner.temp }}/llaminar-published-e2e-${{ github.run_id }}/all-cells.json
            ${{ runner.temp }}/llaminar-published-e2e-${{ github.run_id }}/manifest.json
            ${{ runner.temp }}/llaminar-published-e2e-${{ github.run_id }}/inventory-image.json
            ${{ runner.temp }}/llaminar-published-e2e-${{ github.run_id }}/e2e-receipt.json
            ${{ runner.temp }}/llaminar-published-e2e-${{ github.run_id }}/pull.log
            ${{ runner.temp }}/llaminar-published-e2e-${{ github.run_id }}/build-driver.log
            ${{ runner.temp }}/llaminar-published-e2e-${{ github.run_id }}/driver-image.json
            ${{ runner.temp }}/llaminar-published-e2e-${{ github.run_id }}/inventory/*.log
            ${{ runner.temp }}/llaminar-published-e2e-${{ github.run_id }}/inventory/build-timeline.jsonl
            ${{ runner.temp }}/llaminar-published-e2e-${{ github.run_id }}/avx512/**
            ${{ runner.temp }}/llaminar-published-e2e-${{ github.run_id }}/avx2/**
          if-no-files-found: error
          retention-days: 30
