name: Published images — HTTP E2E

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# All image consumers share the same physical accelerator inventory with CI.
concurrency:
  group: llaminar-develop-image-gate
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: [llaminar-bench]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
          lfs: false
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          name: llaminar-ci
          driver-opts: network=host
          cleanup: false
          keep-state: true
          cache-binary: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test both published runtime images with the full canonical HTTP suite
        run: |
          python3 scripts/ci/run_published_image_suite.py e2e \
            --output parity-results/published-e2e \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Retain image-bound E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-e2e-${{ github.run_id }}
          path: |
            parity-results/published-e2e/images.json
            parity-results/published-e2e/all-cells.json
            parity-results/published-e2e/manifest.json
            parity-results/published-e2e/inventory-image.json
            parity-results/published-e2e/e2e-receipt.json
            parity-results/published-e2e/pull.log
            parity-results/published-e2e/build-driver.log
            parity-results/published-e2e/driver-image.json
            parity-results/published-e2e/inventory/*.log
            parity-results/published-e2e/inventory/build-timeline.jsonl
            parity-results/published-e2e/avx512/**
            parity-results/published-e2e/avx2/**
          if-no-files-found: error
          retention-days: 30
